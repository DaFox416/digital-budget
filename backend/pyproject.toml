[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-budget-backend"
version = "0.1.0"
description = "Digital Budget API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2.0",
    "psycopg[binary]>=3.3,<4.0",
    # Time zone database for zoneinfo (Windows and slim images don't ship one)
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx2>=2.16,<3.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=4.7,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Resolve `app` imports from backend/ even when mypy runs from the repo root (pre-commit)
mypy_path = "$MYPY_CONFIG_FILE_DIR"
